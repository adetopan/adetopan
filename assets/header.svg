<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05080f"/>
      <stop offset="0.5" stop-color="#0b1626"/>
      <stop offset="1" stop-color="#120a26"/>
    </linearGradient>
    <linearGradient id="flow" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1000" y2="0" spreadMethod="repeat">
      <stop offset="0" stop-color="#00f0ff"/>
      <stop offset="0.5" stop-color="#b44dff"/>
      <stop offset="1" stop-color="#00f0ff"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-1000 0" to="0 0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#00f0ff" stroke-opacity="0.07" stroke-width="1"/>
      <animateTransform attributeName="patternTransform" type="translate" from="0 0" to="40 40" dur="4s" repeatCount="indefinite"/>
    </pattern>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00f0ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00f0ff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#00f0ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="type">
      <rect x="250" y="190" height="40" width="0">
        <animate attributeName="width" values="0;500;500;0" keyTimes="0;0.45;0.85;1" dur="6s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
    <clipPath id="round"><rect width="1000" height="300" rx="18"/></clipPath>
  </defs>

  <style>
    .mono { font-family: 'Fira Code','JetBrains Mono','Courier New',monospace; }
    .name { font-size: 56px; font-weight: 800; letter-spacing: 4px; }
    .g1 { fill:#ff2bd6; animation: glitch1 3.5s infinite steps(1); opacity:0; }
    .g2 { fill:#00f0ff; animation: glitch2 3.5s infinite steps(1); opacity:0; }
    @keyframes glitch1 {
      0%,88%,100% { opacity:0; transform:translate(0,0); }
      89% { opacity:.8; transform:translate(-6px,-2px); }
      91% { opacity:.8; transform:translate(5px,2px); }
      93% { opacity:0; }
    }
    @keyframes glitch2 {
      0%,88%,100% { opacity:0; transform:translate(0,0); }
      90% { opacity:.8; transform:translate(6px,2px); }
      92% { opacity:.8; transform:translate(-5px,-1px); }
      94% { opacity:0; }
    }
    .draw { fill:none; stroke:#00f0ff; stroke-width:1.5; stroke-dasharray:140; animation: dash 6s linear infinite; }
    @keyframes dash { 0% { stroke-dashoffset:140; } 60%,100% { stroke-dashoffset:0; } }
    .float { font-size:14px; fill:#00f0ff; opacity:.25; }
    .pulse { animation: pulse 2s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity:.3; } 50% { opacity:1; } }
    .cursor { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity:0; } }
  </style>

  <g clip-path="url(#round)">
    <rect width="1000" height="300" fill="url(#bg)"/>
    <rect width="1000" height="300" fill="url(#grid)"/>

    <!-- binary rain -->
    <g class="mono float">
      <text x="60" y="320">1011<animate attributeName="y" from="320" to="-20" dur="7s" repeatCount="indefinite"/></text>
      <text x="170" y="320">0110<animate attributeName="y" from="320" to="-20" dur="9s" begin="1s" repeatCount="indefinite"/></text>
      <text x="300" y="320">&lt;/&gt;<animate attributeName="y" from="320" to="-20" dur="8s" begin="2s" repeatCount="indefinite"/></text>
      <text x="720" y="320">{ }<animate attributeName="y" from="320" to="-20" dur="10s" begin="0.5s" repeatCount="indefinite"/></text>
      <text x="840" y="320">0101<animate attributeName="y" from="320" to="-20" dur="7.5s" begin="3s" repeatCount="indefinite"/></text>
      <text x="930" y="320">1100<animate attributeName="y" from="320" to="-20" dur="9s" begin="1.5s" repeatCount="indefinite"/></text>
    </g>

    <!-- scan line -->
    <rect x="0" y="-80" width="1000" height="80" fill="url(#scan)">
      <animate attributeName="y" from="-80" to="300" dur="4s" repeatCount="indefinite"/>
    </rect>

    <!-- top status -->
    <g class="mono" font-size="13" fill="#7dd8e6">
      <circle cx="40" cy="38" r="5" fill="#00ff9d" class="pulse"/>
      <text x="55" y="43">ONLINE · adetopan@github</text>
      <text x="960" y="43" text-anchor="end" opacity=".7">v2026.10</text>
    </g>

    <!-- NAME -->
    <g class="mono name" text-anchor="middle">
      <text class="g1" x="500" y="130">ADE TOPAN PRAYOGA</text>
      <text class="g2" x="500" y="130">ADE TOPAN PRAYOGA</text>
      <text x="500" y="130" fill="url(#flow)" filter="url(#glow)">ADE TOPAN PRAYOGA</text>
      <text class="draw" x="500" y="130">ADE TOPAN PRAYOGA</text>
    </g>

    <!-- divider -->
    <line x1="300" y1="160" x2="700" y2="160" stroke="url(#flow)" stroke-width="2" stroke-linecap="round">
      <animate attributeName="stroke-opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite"/>
    </line>

    <!-- typed subtitle -->
    <g class="mono" font-size="24" fill="#e6faff" text-anchor="middle" letter-spacing="6">
      <text x="500" y="215" clip-path="url(#type)">FULL STACK PROGRAMMER</text>
    </g>
    <text class="mono cursor" x="760" y="215" font-size="24" fill="#00f0ff">▌</text>

    <!-- tags -->
    <g class="mono" font-size="13" fill="#00f0ff" text-anchor="middle" opacity=".85">
      <text x="500" y="262">&lt;Frontend /&gt;   •   {Backend}   •   [Database]   •   $DevOps</text>
    </g>

    <!-- corner brackets -->
    <g stroke="#00f0ff" stroke-width="2" fill="none" opacity=".7">
      <path d="M14 44V14H44"/><path d="M956 14H986V44"/>
      <path d="M14 256V286H44"/><path d="M956 286H986V256"/>
    </g>
  </g>
  <rect x="1" y="1" width="998" height="298" rx="18" fill="none" stroke="url(#flow)" stroke-width="2"/>
</svg>
